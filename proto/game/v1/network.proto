syntax = "proto3";

package game.v1;

message Input {
  uint32 seq = 1;
  float move_x = 2;
  float move_y = 3;
}

message SnapshotEntity {
  uint32 id = 1;
  float x = 2;
  float y = 3;
  uint32 hp = 4;
}

message Snapshot {
  uint32 tick = 1;
  repeated SnapshotEntity entities = 2;
}

message ClientMessage {
  oneof payload {
    Input input = 1;
  }
}

message ServerMessage {
  oneof payload {
    Snapshot snapshot = 1;
  }
}
